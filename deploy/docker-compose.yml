# Лежит на сервере в ~/testboard/. Образ собирает GitHub Actions, Watchtower подтягивает новый.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: buisnes_board
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bb -d buisnes_board"]
      interval: 5s
      retries: 10

  app:
    image: ghcr.io/dmitriyg0r/buisnes-board:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://bb:${DB_PASSWORD}@db:5432/buisnes_board
      SECRETS_KEY: ${SECRETS_KEY}
      COOKIE_SECURE: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      RUST_LOG: bb_backend=info,tower_http=info
      # запросы к OpenAI/ChatGPT идут через ретранслятор к xray на хосте (OpenAI блокирует регион сервера)
      OPENAI_PROXY: http://172.26.0.1:1081
    ports:
      - "127.0.0.1:18090:8080"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Мост до xray на хосте: xray слушает только 127.0.0.1, а контейнеры его не видят.
  # Слушаем только на адресе шлюза сети этого проекта и пересылаем на 127.0.0.1:1081.
  openai-proxy:
    image: alpine/socat
    restart: unless-stopped
    network_mode: host
    command: TCP-LISTEN:1081,bind=172.26.0.1,fork,reuseaddr TCP:127.0.0.1:1081

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    command: --label-enable --interval 60 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  default:
    ipam:
      config:
        - subnet: 172.26.0.0/16
          gateway: 172.26.0.1

volumes:
  pgdata:
